<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResQvision — Emergency Coordination Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f4f7fa;--surface:#fff;--surface2:#f8fafc;--text:#142238;--muted:#6b7a90;--line:#dfe6ee;--brand:#087f6b;--brand2:#0d6fbe;--red:#d84c4c;--amber:#c57a08;--green:#148a6b;--purple:#7654c8;--shadow:0 8px 28px rgba(20,34,56,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;z-index:5}.brand{font-weight:800;font-size:21px;display:flex;gap:10px;align-items:center;padding:10px}.brand-badge{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}.nav{margin-top:22px}.nav button{width:100%;text-align:left;background:transparent;padding:12px 13px;border-radius:10px;color:var(--muted);margin:2px 0}.nav button.active,.nav button:hover{background:#edf8f5;color:var(--brand);font-weight:700}.rolebox{position:absolute;bottom:18px;left:14px;right:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.rolebox small{display:block;color:var(--muted);margin-bottom:6px}.rolebox select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:4}.search{flex:1;max-width:620px;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 14px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.pill.live{color:var(--green);background:#eefaf6}.pill.demo{color:var(--amber);background:#fff8e8}.avatar{width:34px;height:34px;border-radius:50%;background:#dceaf7;display:grid;place-items:center;font-weight:700;color:#275b82}
.content{padding:24px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.heading h1{margin:0 0 5px;font-size:25px}.heading p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--text)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.warn{background:#fff6e8;color:#9b6200;border-color:#f0d29a}.btn.danger{background:#fff0f0;color:#a93030;border-color:#f2c1c1}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.kpi{padding:16px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:26px;font-weight:800;margin-top:7px}.kpi .delta{font-size:11px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--brand2)}
.two{grid-template-columns:1.65fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.map{height:500px;border-radius:13px;overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h3{margin:0;font-size:14px}.card-body{padding:15px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{font-size:11px;padding:7px 9px;border-radius:999px;background:#f4f6f8;color:var(--muted)}.filter.active{background:#e8f5f2;color:var(--brand);font-weight:700}
.list{display:flex;flex-direction:column}.row{padding:12px 14px;border-bottom:1px solid #edf0f4;display:flex;gap:10px;align-items:flex-start}.row:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--amber);flex:none}.dot.red{background:var(--red)}.dot.green{background:var(--green)}.dot.blue{background:var(--brand2)}.grow{flex:1}.row strong{font-size:12px}.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tag{font-size:10px;padding:4px 6px;border-radius:6px;background:#eef2f6;color:#526278}.tag.red{background:#fff0f0;color:#a93030}.tag.green{background:#edf9f5;color:#147a5f}.tag.amber{background:#fff7e8;color:#9a6307}.tag.blue{background:#edf5ff;color:#2a65a5}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:#fbfcfd}.input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar .input{max-width:280px}
.social-post{padding:13px 15px;border-bottom:1px solid #edf0f4}.social-post:last-child{border-bottom:0}.social-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.social-post p{font-size:12px;line-height:1.5;margin:8px 0}.source{font-size:10px;padding:3px 6px;border-radius:5px;background:#eef2f6}.credbar{height:5px;background:#e9edf2;border-radius:99px;overflow:hidden}.credbar span{display:block;height:100%;background:var(--green)}
.resource{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.resource strong{font-size:12px}.resource .meta{font-size:11px;color:var(--muted);margin-top:5px}.status{font-size:10px;padding:4px 7px;border-radius:6px;float:right}.status.ok{background:#edf9f5;color:#147a5f}.status.warn{background:#fff7e8;color:#9a6307}.status.bad{background:#fff0f0;color:#a93030}
.chat{height:570px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:15px}.msg{max-width:78%;padding:10px 12px;border-radius:11px;margin:7px 0;font-size:12px;line-height:1.5}.msg.user{margin-left:auto;background:#e8f5f2}.msg.ai{background:#f1f4f7}.chatbar{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}.chatbar textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:10px}.typing{font-size:11px;color:var(--muted);padding:0 15px 7px;display:none}
.chain{display:flex;align-items:stretch;gap:8px;overflow:auto;padding-bottom:5px}.chain-node{min-width:170px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.chain-node .icon{font-size:20px}.chain-arrow{display:grid;place-items:center;color:#9aa8b8;font-weight:800}.impact{border-left:3px solid var(--amber);padding:10px 12px;background:#fffaf0;border-radius:0 8px 8px 0;margin-top:8px;font-size:12px}.lock{font-size:10px;color:#9b6200;background:#fff7e8;border:1px solid #f0d29a;border-radius:5px;padding:3px 6px}
.modal{position:fixed;inset:0;background:rgba(12,25,40,.35);display:none;place-items:center;z-index:20;padding:20px}.modal.open{display:grid}.modal-card{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:14px}.modal-body{padding:18px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:90px;resize:vertical}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#142238;color:#fff;padding:11px 14px;border-radius:9px;font-size:12px;display:none;z-index:50;box-shadow:var(--shadow)}
.restricted{opacity:.65}.notice{padding:11px 13px;background:#eef5ff;border:1px solid #cfe1f7;border-radius:9px;font-size:12px;color:#2b5f91;margin-bottom:13px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.rolebox{position:static;margin-top:10px}.topbar{padding:0 12px}.content{padding:14px}.kpis{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}.map{height:420px}.topbar .search{display:none}}

.auth-gate{position:fixed;inset:0;background:linear-gradient(135deg,#071827,#0f3552);display:grid;place-items:center;padding:20px;z-index:100}.login-card{width:min(430px,100%);background:#fff;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.3);padding:28px}.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}.login-brand .logo{width:44px;height:44px}.login-card h1{font-family:Manrope;font-size:24px;margin:8px 0;color:var(--navy)}.login-card p{color:var(--muted);font-size:12px;line-height:1.6}.login-field{margin:14px 0}.login-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#718699;margin-bottom:6px}.login-field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.login-btn{width:100%;margin-top:8px}.login-error{display:none;padding:10px;border-radius:9px;background:#fff0f0;color:#a93030;font-size:11px;margin-top:10px}.demo-note{font-size:10px;color:#80909e;margin-top:12px;line-height:1.5}.secure-badge{display:inline-block;background:#eef8f5;color:var(--teal);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}

.map-fallback{height:100%;display:grid;place-items:center;background:linear-gradient(180deg,#eef5f8,#f8fafc);color:var(--muted);padding:25px;text-align:center}.map-fallback .map-points{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(620px,100%)}.map-point{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;text-align:left;font-size:11px}.map-point b{display:block;color:var(--text);margin-bottom:3px}.action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn.small{padding:6px 8px;font-size:10px}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.statline{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-top:7px}.select-mini{padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:11px}
.citizen-reports{margin:0 0 18px}.citizen-reports .report-card{display:grid;grid-template-columns:170px 1fr auto;gap:14px;align-items:start;border:1px solid #dbe5ed;border-radius:15px;padding:12px;background:#fff;margin-top:10px}.citizen-reports .report-card img{width:170px;height:120px;object-fit:cover;border-radius:10px;background:#eef3f6}.citizen-reports .report-meta{font-size:10px;color:#667a8d;line-height:1.55}.citizen-reports .report-meta strong{display:block;font-size:13px;color:#102b46;margin-bottom:4px}.citizen-reports .report-actions{display:flex;gap:7px;flex-direction:column}.citizen-reports .empty{padding:16px;border:1px dashed #cfdbe4;border-radius:12px;color:#667a8d;font-size:11px}@media(max-width:800px){.citizen-reports .report-card{grid-template-columns:1fr}.citizen-reports .report-card img{width:100%;height:190px}.citizen-reports .report-actions{flex-direction:row;flex-wrap:wrap}}
</head>
<body><div id="authGate" class="auth-gate"><div class="login-card">
  <div class="login-brand"><span class="logo">R</span><div><b style="font-family:Manrope;font-size:18px;color:var(--navy)">ResQvision</b><span style="display:block;font-size:10px;color:var(--muted)">Administrator portal</span></div></div>
  <span class="secure-badge">● ADMIN ACCESS ONLY</span>
  <h1>Sign in to Command Center</h1>
  <p>Administrator credentials are required to access crisis social signals, incident verification, impact-chain analysis, dispatch controls and operational resources.</p>
  <form id="loginForm">
    <div class="login-field"><label>Email</label><input id="adminEmail" type="email" autocomplete="username" value="admin@resqvision.local" required></div>
    <div class="login-field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Enter password" required></div>
    <button class="btn primary login-btn" type="submit">Sign in as Administrator →</button>
  </form>
  <div id="loginError" class="login-error"></div>
  <div id="backendStatus" style="font-size:11px;margin-top:8px;color:#148a6b">● ResQvision browser demo ready · no backend required</div>
  <div class="demo-note"><b>Demo profile:</b> admin@resqvision.local / ResQvision@123<br>Change these credentials in the server environment before production.</div>
</div></div>

<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-badge">R</div> ResQvision</div>
  <div class="nav">
    <button class="active" data-view="dashboard">⌂ Command Center</button>
    <button data-view="incidents">⚠ Incidents</button>
    <button data-view="social">◉ Crisis Social Feed</button>
    <button data-view="map">⌖ Live Map</button>
    <button data-view="resources">＋ Hospitals & Resources</button>
    <button data-view="teams">♟ Response Teams</button>
    <button data-view="chain">↗ Impact Chain</button>
    <button data-view="ai">✦ AI Copilot</button>
    <button data-view="citizenReports">📷 Citizen Reports</button>
    <button data-view="alerts" class="admin-only">🔔 Admin Alerts</button>
  </div>
  <div class="rolebox">
     <small>Secure administrator profile</small>
     <div style="display:flex;align-items:center;gap:8px;margin-top:6px"><div class="avatar" style="width:30px;height:30px">A</div><div><b style="font-size:12px">Incident Commander</b><span style="display:block;font-size:10px;color:var(--muted)">Administrator</span></div></div>
     <button class="btn" style="width:100%;margin-top:10px" onclick="logoutAdmin()">Sign out</button>
   </div>
</aside>

<main class="main">
<header class="topbar">
  <div class="search"><input id="globalSearch" placeholder="Search incidents, locations, hospitals, social posts…"></div>
  <div class="top-actions"><span class="pill live" id="dataMode">ADMIN SECURE SESSION</span><span class="pill" id="clock"></span><div class="avatar" id="avatar">A</div></div>
</header>

<div class="content">

<section id="dashboard" class="view active">
  <div class="heading"><div><h1>Emergency Command Center</h1><p>One operational picture for incidents, social signals, resources, teams and cascading impacts.</p></div><div class="actions"><button class="btn" onclick="locateMe()">Use my location</button><button class="btn primary" onclick="openModal('incidentModal')">+ New incident</button></div></div>
  <div class="notice">External feeds are shown as <b>LIVE</b> only when an authorized connector is configured. Otherwise ResQvision uses clearly labelled demo data—never assume demo hospital, ambulance or social-media values are real.</div>
  <div class="grid kpis">
    <div class="card kpi"><div class="label">Active incidents</div><div class="value" id="kInc">6</div><div class="delta red">2 critical</div></div>
    <div class="card kpi"><div class="label">People needing help</div><div class="value">148</div><div class="delta amber">+18 last hour</div></div>
    <div class="card kpi"><div class="label">Teams deployed</div><div class="value">9</div><div class="delta green">7 responding</div></div>
    <div class="card kpi"><div class="label">Medical capacity</div><div class="value" id="kMed">64%</div><div class="delta amber">Monitor surge</div></div>
    <div class="card kpi"><div class="label">Credibility queue</div><div class="value">11</div><div class="delta blue">4 need review</div></div>
  </div>
  <div class="grid two">
    <div class="card"><div class="card-head"><h3>Common operating map</h3><div class="filters"><button class="filter active" onclick="setMapFilter('all',this)">All</button><button class="filter" onclick="setMapFilter('help',this)">Help needed</button><button class="filter" onclick="setMapFilter('affected',this)">Affected</button><button class="filter" onclick="setMapFilter('resources',this)">Resources</button></div></div><div id="mapDash" class="map"></div></div>
    <div class="card"><div class="card-head"><h3>Priority incidents</h3><button class="btn" onclick="showView('incidents')">View all</button></div><div id="priorityList" class="list"></div></div>
  </div>
  <div class="grid three" style="margin-top:14px">
    <div class="card"><div class="card-head"><h3>Nearby medical & transport</h3></div><div class="card-body" id="resourceMini"></div></div>
    <div class="card"><div class="card-head"><h3>Social crisis signals</h3><span class="tag blue">AI triage</span></div><div id="socialMini" class="list"></div></div>
    <div class="card"><div class="card-head"><h3>Latest activity</h3></div><div id="activity" class="list"></div></div>
  </div>
</section>

<section id="citizenReports" class="view">
  <div class="heading"><div><h1>Citizen Reports</h1><p>Photo + current-location incident submissions received from the Citizen page.</p></div><div class="actions"><button class="btn" onclick="renderCitizenReports()">↻ Refresh reports</button></div></div>
  <div class="notice">Citizen submissions are shown only in this dedicated page. Admins can verify, dispatch, open the location on the map, or delete a submitted photo/report.</div>
  <div class="card citizen-reports"><div class="card-head"><h3>Incoming citizen incident reports</h3><span class="tag blue">Citizen intake</span></div><div id="citizenReportsList" style="padding:15px"><div class="empty">Loading citizen reports…</div></div></div>
</section>

<section id="incidents" class="view">
  <div class="heading"><div><h1>Incident Management</h1><p>Reports from public intake, field teams and approved social connectors.</p></div><div class="actions"><button class="btn" onclick="showView('social')">Review social signals</button><button class="btn primary" onclick="openModal('incidentModal')">+ Create incident</button></div></div>
  <div class="card"><div class="card-body"><div class="toolbar"><input id="incidentSearch" class="input" placeholder="Filter incidents…" oninput="renderIncidents()"><select id="severityFilter" class="input" style="max-width:180px" onchange="renderIncidents()"><option value="">All severity</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select><select id="statusFilter" class="input" style="max-width:180px" onchange="renderIncidents()"><option value="">All status</option><option>Help needed</option><option>In response</option><option>Affected</option><option>Monitoring</option><option>Needs review</option><option>Resolved</option></select><button class="btn" onclick="clearIncidentFilters()">Clear</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Incident</th><th>Location</th><th>Severity</th><th>Credibility</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead><tbody id="incidentTable"></tbody></table></div></div></div>
</section>

<section id="social" class="view">
  <div class="heading"><div><h1>Crisis Social Feed</h1><p>Bring approved public posts into the same incident workflow. Verify before treating a post as fact.</p></div><div class="actions"><button class="btn" onclick="refreshSocial()">↻ Refresh</button><button class="btn primary admin-only" onclick="openModal('connectorModal')">+ Configure connector</button></div></div>
  <div class="grid two">
    <div class="card"><div class="card-head"><h3>Aggregated crisis posts</h3><span class="pill demo" id="socialMode">DEMO FEED</span></div><div id="socialFeed"></div></div>
    <div class="card"><div class="card-head"><h3>Verification queue</h3></div><div class="card-body"><div class="notice">AI can prioritize signals, but an authorized human should confirm important reports before dispatch.</div><div id="verificationQueue"></div></div></div>
  </div>
</section>

<section id="map" class="view">
  <div class="heading"><div><h1>Live Map</h1><p>Incidents, social signals, hospitals, ambulances, shelters and team positions.</p></div><div class="actions"><button class="btn" onclick="fitMap()">Fit all</button><button class="btn" onclick="locateMe()">Locate me</button></div></div>
  <div class="card"><div id="mapFull" class="map" style="height:650px"></div></div>
</section>

<section id="resources" class="view">
  <div class="heading"><div><h1>Hospitals, Ambulances & Resources</h1><p>Check proximity and operational availability around an incident.</p></div><button class="btn primary" onclick="checkNearest()">Check near selected incident</button></div>
  <div class="notice"><b>Live capacity requires a trusted hospital/EMS integration.</b> ResQvision does not invent bed counts or ambulance availability. The demo mode is explicitly marked.</div>
  <div class="grid two"><div class="card"><div class="card-head"><h3>Resource status</h3><span class="pill demo" id="resourceMode">DEMO</span></div><div class="card-body"><div class="toolbar"><input id="resourceSearch" class="input" placeholder="Search resources…" oninput="renderResources()"><select id="resourceFilter" class="input" style="max-width:180px" onchange="renderResources()"><option value="">All types</option><option>Hospital</option><option>Ambulance</option><option>Shelter</option><option>Supplies</option><option>Response Team</option></select></div><div id="resourceGrid" class="grid" style="grid-template-columns:1fr 1fr"></div></div></div>
  <div class="card"><div class="card-head"><h3>Nearest-resource analysis</h3></div><div class="card-body" id="nearestResult"><p style="color:var(--muted);font-size:12px">Select an incident to calculate proximity and cascading access risk.</p></div></div></div>
</section>

<section id="teams" class="view">
  <div class="heading"><div><h1>Response Teams</h1><p>Volunteers can view tasks and submit field updates. Admins can dispatch and manage teams.</p></div><button class="btn primary admin-only" onclick="notifyTeams()">Notify nearby teams</button></div>
  <div class="card"><div class="card-body"><div class="toolbar"><input id="teamSearch" class="input" placeholder="Search teams…" oninput="renderTeams()"><select id="teamStatusFilter" class="input" style="max-width:180px" onchange="renderTeams()"><option value="">All statuses</option><option>Available</option><option>Responding</option><option>Monitoring</option><option>Offline</option></select></div><div id="teamGrid" class="grid three"></div></div></div>
</section>

<section id="chain" class="view">
  <div class="heading"><div><h1>After-Incident Impact Chain</h1><p>Model second-order effects instead of looking at the first incident in isolation.</p></div><div class="actions"><select id="chainIncident" class="input" style="max-width:250px"></select><button class="btn primary" onclick="runChain()">Run impact analysis</button></div></div>
  <div class="grid two">
    <div class="card"><div class="card-head"><h3>Cascade graph</h3><span class="tag amber">Decision support</span></div><div class="card-body"><div id="chainGraph" class="chain"></div><div id="chainImpacts"></div></div></div>

function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2600)}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const target=document.getElementById(id);if(!target)return;target.classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='map')setTimeout(initFullMap,80)}

function updateKpis(){const active=incidents.filter(x=>x.status!=='Resolved').length;const critical=incidents.filter(x=>x.severity==='critical'&&x.status!=='Resolved').length;document.getElementById('kInc').textContent=active;document.querySelector('#kInc').parentElement.querySelector('.delta').textContent=`${critical} critical`;document.querySelector('#kInc').parentElement.querySelector('.delta').className='delta '+(critical?'red':'green');document.querySelectorAll('.kpi .value')[1].textContent=String(Math.max(0,incidents.length*14+8));document.querySelectorAll('.kpi .delta')[1].textContent='+12 last hour';document.querySelectorAll('.kpi .value')[2].textContent=String(teams.filter(t=>t.status==='Responding').length+6);document.querySelectorAll('.kpi .delta')[2].textContent=`${teams.filter(t=>t.status==='Responding').length} responding`;document.getElementById('kMed').textContent=Math.max(20,100-resources.filter(r=>r.kind==='Hospital').length*7)+'%';document.querySelectorAll('.kpi .value')[4].textContent=String(social.filter(s=>!s.approved).length+3);document.querySelectorAll('.kpi .delta')[4].textContent=`${social.filter(s=>s.cred<80&&!s.approved).length} need review`}
function markerColor(i){return i.severity==='critical'?'red':i.status==='Help needed'?'orange':i.status==='Affected'?'blue':'green'}
function initMap(el){if(typeof L==='undefined')return null;const m=L.map(el,{scrollWheelZoom:false}).setView(center,12.7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);return m}
function fallbackMap(el,filter='all'){el.innerHTML=`<div class="map-fallback"><div><b>Operational map fallback</b><p>Map tiles are unavailable in this environment. Records remain fully usable below.</p><div class="map-points">${[...incidents,...resources].filter(x=>{if(x.kind)return filter==='all'||filter==='resources';if(filter==='help')return x.status==='Help needed';if(filter==='affected')return x.status==='Affected';return true}).slice(0,12).map(x=>`<div class="map-point"><b>${escapeHtml(x.kind||x.type)}</b>${escapeHtml(x.location||x.name)}<br><span>${x.kind?escapeHtml(x.status):escapeHtml(x.severity)+' · '+x.cred+'%'}</span></div>`).join('')}</div></div></div>`}
function addMarkers(m,store,filter='all'){if(!m||typeof L==='undefined')return;[...incidents,...resources].forEach(x=>{let show=true;if(x.kind)show=filter==='all'||filter==='resources';else if(filter==='help')show=x.status==='Help needed';else if(filter==='affected')show=x.status==='Affected';if(!show)return;const mk=L.circleMarker([x.lat,x.lng],{radius:x.kind?8:9,color:x.kind?'#2875d1':markerColor(x)==='red'?'#d84c4c':markerColor(x)==='orange'?'#c57a08':markerColor(x)==='blue'?'#2875d1':'#148a6b',fillOpacity:.8});mk.bindPopup(`<b>${escapeHtml(x.kind||x.type)}</b><br>${escapeHtml(x.location||x.name)}<br>${x.kind?escapeHtml(x.value+' · '+x.status):escapeHtml(x.severity)+' · credibility '+x.cred+'%'}`);mk.addTo(m);store.push(mk)})}

function renderSocial(){document.getElementById('socialFeed').innerHTML=social.map((s,i)=>`<div class="social-post"><div class="social-meta"><b>${escapeHtml(s.user)}</b><span>· ${escapeHtml(s.time)}</span><span class="source">${escapeHtml(s.source)}</span><span style="margin-left:auto">cred ${s.cred}%</span></div><p>${escapeHtml(s.text)}</p><div class="credbar"><span style="width:${s.cred}%"></span></div><div class="action-row"><span class="tag ${s.approved?'green':'amber'}">${s.approved?'APPROVED':'REVIEW'}</span><button class="btn small" onclick="openSocialIncident(${i})">Open as signal</button>${role==='admin'&&!s.approved?`<button class="btn small primary" onclick="approveSocial(${i})">Approve</button><button class="btn small danger" onclick="rejectSocial(${i})">Reject</button>`:''}</div></div>`).join('');document.getElementById('socialMini').innerHTML=social.slice(0,3).map(s=>`<div class="row"><div class="dot amber"></div><div class="grow"><strong>${escapeHtml(s.location)}</strong><small>${escapeHtml(s.text)}</small></div><span class="tag blue">${s.cred}%</span></div>`).join('');document.getElementById('verificationQueue').innerHTML=social.filter(s=>!s.approved).map((s,i)=>`<div class="resource" style="margin-bottom:8px"><strong>${escapeHtml(s.location)}</strong><div class="meta">${escapeHtml(s.text)}</div><div class="statline"><span>Credibility ${s.cred}%</span><span>${s.cred>=80?'Higher confidence':'Needs review'}</span></div><div class="action-row"><button class="btn small" onclick="approveSocial(${social.indexOf(s)})">Approve</button><button class="btn small" onclick="openSocialIncident(${social.indexOf(s)})">Create incident</button></div></div>`).join('')||'<div class="empty">Verification queue is clear.</div>'}

function focusIncident(id){const x=incidents.find(i=>i.id===id);if(!x)return;if(fullMap){showView('map');setTimeout(()=>{fullMap.setView([x.lat,x.lng],15);L.popup().setLatLng([x.lat,x.lng]).setContent(`<b>${escapeHtml(x.type)}</b><br>${escapeHtml(x.location)}<br>${escapeHtml(x.desc)}`).openOn(fullMap)},100)}else{showView('map');toast(`${x.type} — ${x.location} (${x.severity})`)}}

function assignIncident(id){if(role!=='admin')return toast('Admin permission required.');const x=incidents.find(i=>i.id===id);const names=teams.map(t=>t.name);const pick=prompt(`Assign ${x.type} at ${x.location} to:\n\n${names.join('\n')}`);if(!pick)return;if(!names.includes(pick))return toast('Team name did not match a configured team.');x.owner=pick;x.status='In response';addActivity(`${pick} assigned to ${x.location}`,'green');persist();renderAll();toast('Incident assigned successfully.')}

function renderTeams(){const q=(document.getElementById('teamSearch')?.value||'').toLowerCase(),f=document.getElementById('teamStatusFilter')?.value||'';const rows=teams.filter(t=>(!q||JSON.stringify(t).toLowerCase().includes(q))&&(!f||t.status===f));document.getElementById('teamGrid').innerHTML=rows.length?rows.map((t)=>{const i=teams.indexOf(t);return `<div class="resource"><span class="status ${t.status==='Available'?'ok':t.status==='Offline'?'bad':'warn'}">${escapeHtml(t.status)}</span><strong>${escapeHtml(t.name)}</strong><div class="meta">${escapeHtml(t.specialty)}</div><div class="meta">Location: ${escapeHtml(t.location)}</div><div class="meta">Task: ${escapeHtml(t.task)}</div><div class="action-row">${role==='admin'?`<button class="btn small" onclick="cycleTeamStatus(${i})">Change status</button><button class="btn small" onclick="notifyOneTeam(${i})">Notify</button>`:''}<button class="btn small" onclick="toast('Field update request sent to ${escapeHtml(t.name)}')">Update</button></div></div>`}).join(''):'<div class="empty">No matching teams.</div>'}
function cycleTeamStatus(i){if(role!=='admin')return toast('Admin permission required.');const order=['Available','Responding','Monitoring','Offline'];const t=teams[i];t.status=order[(order.indexOf(t.status)+1)%order.length];addActivity(`${t.name} status changed to ${t.status}`,'blue');persist();renderTeams();updateKpis();toast(`${t.name}: ${t.status}`)}

function toggleResource(i){if(role!=='admin')return toast('Admin permission required.');const r=resources[i];const states=r.kind==='Ambulance'?['Available','Busy','Offline']:['Available','Responding','Monitoring','Offline'];const next=states[(states.indexOf(r.status)+1)%states.length];r.status=next;r.tone=next==='Available'||next==='Open'||next==='Ready'?'ok':next==='Offline'?'bad':'warn';addActivity(`${r.name} status changed to ${next}`,'blue');persist();renderResources();toast(`${r.name}: ${next}`)}
function checkNearest(){const x=incidents.find(i=>i.status!=='Resolved')||incidents[0];const nearby=resources.filter(r=>r.kind==='Hospital'||r.kind==='Ambulance').map(r=>({...r,score:Math.hypot((r.lat-x.lat)*111,(r.lng-x.lng)*105)})).sort((a,b)=>a.score-b.score);document.getElementById('nearestResult').innerHTML=`<div class="notice">For <b>${escapeHtml(x.type)} · ${escapeHtml(x.location)}</b>, nearest configured records are ranked by approximate map distance. Live availability must come from an authorized provider.</div>`+nearby.map(r=>`<div class="resource" style="margin-bottom:8px"><strong>${escapeHtml(r.name)}</strong><span class="status ${r.tone}">${escapeHtml(r.status)}</span><div class="meta">${escapeHtml(r.kind)} · ${escapeHtml(r.value)} · approx ${r.score.toFixed(1)} km</div><div class="impact">${r.kind==='Hospital'&&r.status==='Verify live'?'Verify receiving capacity before transport.':r.kind==='Ambulance'&&r.status!=='Available'?'Unit is not marked available in demo records. Check another unit.':'No demo warning generated.'}</div></div>`).join('');showView('resources')}
function renderChainOptions(){document.getElementById('chainIncident').innerHTML=incidents.map(x=>`<option value="${x.id}">${escapeHtml(x.type)} · ${escapeHtml(x.location)}</option>`).join('')}
function runChain(){const x=incidents.find(i=>i.id==document.getElementById('chainIncident').value)||incidents[0];let nodes=[],impacts=[],recs=[];if(/flood|water/i.test(x.type)){nodes=[['🌧️','Flooding'],['⛔','Road access reduced'],['🚑','Ambulance ETA risk'],['🏥','Hospital access risk'],['🏠','Shelter demand rises']];impacts=['Road closure can delay response vehicles.','A blocked route can make the nearest hospital less useful even if beds exist.','If medical capacity tightens, reroute to the next verified receiving facility.','Shelter demand may increase as households lose access to safe areas.'];recs=['Check road-closure feed and alternate routes.','Re-check ambulance status before dispatch.','Compare at least two verified receiving facilities.','Notify shelter coordinators if demand crosses threshold.']}else if(/medical/i.test(x.type)){nodes=[['🚑','Medical demand'],['🏥','Hospital capacity'],['🚗','Traffic / access'],['🛏️','Alternate facility load']];impacts=['A demand spike can reduce available receiving capacity.','Traffic restrictions can change the nearest practical facility.','Redirecting patients may create secondary capacity pressure elsewhere.'];recs=['Refresh live bed/acceptance status.','Check ambulance availability and route.','Monitor alternate-facility capacity.']}else{nodes=[['⚠️',x.type],['🛣️','Access / infrastructure'],['🚑','Response logistics'],['🏥','Medical / shelter capacity']];impacts=['Infrastructure disruption can affect travel time and resource reach.','Secondary demand may appear at nearby shelters or hospitals.'];recs=['Verify access conditions.','Refresh nearby resource status.','Monitor new reports around the incident perimeter.']}document.getElementById('chainGraph').innerHTML=nodes.map((n,i)=>(i?'<div class="chain-arrow">→</div>':'')+`<div class="chain-node"><div class="icon">${n[0]}</div><b style="font-size:12px">${escapeHtml(n[1])}</b></div>`).join('');document.getElementById('chainImpacts').innerHTML=impacts.map(t=>`<div class="impact">${escapeHtml(t)}</div>`).join('');document.getElementById('chainRecommendations').innerHTML=recs.map((r,i)=>`<div class="row"><div class="dot ${i===0?'red':'blue'}"></div><div class="grow"><strong>Check ${i+1}</strong><small>${escapeHtml(r)}</small></div></div>`).join('')}
function renderActivity(){document.getElementById('activity').innerHTML=activity.slice(0,6).map(a=>`<div class="row"><div class="dot ${a.tone||'blue'}"></div><div class="grow"><strong>${escapeHtml(a.text)}</strong><small>${escapeHtml(a.time)}</small></div></div>`).join('')}
let aiBusy=false;
async function sendChat(){if(aiBusy)return;const input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;appendMsg(text,'user');input.value='';document.getElementById('typing').style.display='block';aiBusy=true;try{await new Promise(r=>setTimeout(r,450));const reply=localAI(text);appendMsg(reply,'ai');document.getElementById('aiMode').textContent='RESQVISION AI • READY';document.getElementById('aiMode').className='pill live'}catch(e){appendMsg('I could not analyze that request. Try asking about priorities, incidents, resources, teams, verification, alerts, or impact.','ai')}finally{aiBusy=false;document.getElementById('typing').style.display='none'}}
function appendMsg(t,who){const el=document.getElementById('messages');const d=document.createElement('div');d.className='msg '+who;d.textContent=t;el.appendChild(d);el.scrollTop=el.scrollHeight}
function localAI(q){
  const text=q.trim(), l=text.toLowerCase();
  const active=incidents.filter(i=>i.status!=='Resolved');
  const critical=active.filter(i=>i.severity==='critical');
  const high=active.filter(i=>i.severity==='high');
  const review=social.filter(x=>!x.approved).sort((a,b)=>b.cred-a.cred);
  const responding=teams.filter(t=>t.status==='Responding');
  const availableTeams=teams.filter(t=>t.status==='Available');
  const available=resources.filter(r=>['Available','Open','Ready'].includes(r.status));
  const hospitals=resources.filter(r=>r.kind==='Hospital');
  const ambulances=resources.filter(r=>r.kind==='Ambulance');
  const top=active.slice().sort((a,b)=>{const rank={critical:3,high:2,medium:1,low:0};return (rank[b.severity]-rank[a.severity])||(b.cred-a.cred)}).slice(0,3);
  const findIncident=()=>{for(const i of active){if(l.includes(String(i.id))||l.includes(i.location.toLowerCase())||l.includes(i.type.toLowerCase()))return i}return null};
  const incident=findIncident();
  const now=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const list=(arr)=>arr.map((x,i)=>`${i+1}. ${x}`).join('\n');

  if(/^(hi|hello|hey|yo|good morning|good afternoon|good evening)\b/i.test(text))
    return `Hello. I’m ResQvision AI. I’m looking at the current command-center records with you.\n\nRight now I can help you prioritize incidents, verify reports, compare resources, coordinate teams, draft alerts, or explain cascading impacts. What would you like to decide first?`;

  if(/help|what can you do|capabilit/i.test(l))
    return `I can work with the records currently loaded in this Command Center.\n\n• Prioritize incidents and explain why\n• Rank the verification queue\n• Check hospital, ambulance and shelter records\n• Recommend response teams\n• Summarize the current situation\n• Explain an incident’s impact chain\n• Draft an operational alert\n\nFor example: “What should I do first?”, “Which team should handle Velachery?”, or “Give me a 30-second commander brief.”`;

  if(/(what should i do|what do i do|next step|next steps|priorit|urgent|right now|first)/i.test(l)){
    const p1=top[0],p2=top[1],p3=top[2];
    return `Here’s how I would sequence the response at ${now}:\n\n1. ${p1?`Verify ${p1.type} in ${p1.location} (${p1.severity}, ${p1.cred}% credibility).`: 'Clear the highest-severity verified incident first.'}\n2. ${p2?`Coordinate ${p2.owner==='Unassigned'?'an appropriate response team':p2.owner} for ${p2.location}.`: 'Confirm team availability before dispatch.'}\n3. ${review[0]?`Verify the ${review[0].location} social signal (${review[0].cred}% credibility) before treating it as operational fact.`:'Review any new unverified signals.'}\n4. Confirm route access and receiving-resource status before moving people or supplies.\n\nWhy: critical incidents come first, but uncertainty around access and resource availability can create secondary delays.`;
  }

  if(/summar|brief|commander|situation|overview|status/i.test(l))
    return `Commander brief — ${now}\n\n• ${active.length} active incidents; ${critical.length} critical and ${high.length} high severity.\n• Priority zones: ${top.map(x=>x.location).join(', ')||'none currently flagged'}.\n• ${review.length} social signals are awaiting verification; highest queue score is ${review[0]?.cred??'—'}%.\n• ${responding.length} teams are marked Responding and ${availableTeams.length} Available.\n• ${available.length} resource records are marked available/open/ready.\n\nRecommended focus: verify the critical records, confirm access routes, then validate medical/shelter capacity before dispatch decisions. Dashboard resource values should be treated as demo records unless a trusted live feed is connected.`;

  if(/verif|social|credib|report|signal/i.test(l)){
    const lines=review.slice(0,5).map(s=>`${s.location} — ${s.cred}% credibility — ${s.text}`);
    return `I’d work the verification queue in this order:\n\n${lines.length?list(lines):'No unverified signals are currently waiting.'}\n\nRecommendation: corroborate high-impact reports with a field update or trusted source before dispatch. A credibility score is a prioritization aid, not proof that a report is true.`;
  }

  if(/hospital|ambulance|medical|resource|shelter|capacity/i.test(l)){
    const medIncident=active.find(i=>/medical|evacuation/i.test(i.type))||incident;
    return `Resource assessment${medIncident?` for ${medIncident.location}`:''}:\n\n• Hospitals listed: ${hospitals.length}. Their current entries are marked for verification rather than assumed live capacity.\n• Ambulances: ${ambulances.map(a=>`${a.name} (${a.status})`).join('; ')||'none listed'}.\n• Available/open/ready resource records: ${available.length}.\n\nMy recommendation: confirm receiving-facility acceptance, ambulance status and route access before transport. If the nearest option cannot confirm availability, compare the next suitable verified option.`;
  }

  if(/team|dispatch|volunteer|responder|crew/i.test(l)){
    const target=incident||top[0];
    const matches=target?teams.filter(t=>new RegExp((target.type+'|'+target.location).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(t.task+' '+t.location+' '+t.specialty)):availableTeams;
    const choices=(matches.length?matches:availableTeams).slice(0,4);
    return `Team recommendation${target?` for ${target.type} in ${target.location}`:''}:\n\n${choices.length?choices.map((t,i)=>`${i+1}. ${t.name} — ${t.status} — ${t.specialty} — ${t.location}`).join('\n'):'No suitable team record is currently available.'}\n\nNext check: confirm the team’s latest field status and route before dispatch. ${target?.owner&&target.owner!=='Unassigned'?`The incident is currently assigned to ${target.owner}.`:''}`;
  }

  if(/impact|cascade|second|consequence|downstream/i.test(l)){
    const x=incident||top[0];
    if(!x)return 'Select an incident in Impact Chain and I can explain its likely access, logistics, medical and shelter dependencies.';
    let chain;if(/flood|water/i.test(x.type))chain='Flooding → reduced road access → response/ambulance delay → hospital access risk → increased shelter demand';
    else if(/medical/i.test(x.type))chain='Medical demand → receiving-capacity pressure → transport/route constraints → alternate-facility load';
    else chain=`${x.type} → access/infrastructure disruption → response logistics → secondary demand at nearby resources`;
    return `For ${x.type} in ${x.location}, I’d watch this chain:\n\n${chain}.\n\nThe key decision point is to verify the first dependency that could block response. That means checking route access and the relevant resource status before assuming the next stage will be available.`;
  }

  if(/alert|message|announce|public notice|draft/i.test(l)){
    const x=incident||top[0];
    return `I’d draft the alert around verified facts only:\n\n“${x?`${x.type} has been reported in ${x.location}. Response teams are assessing the situation.`:'A situation has been reported in the affected area. Response teams are assessing the situation.'}”\n\nThen add: what people should do, where verified assistance is available, and what remains unconfirmed. Do not publish demo hospital, ambulance or capacity values as live facts.`;
  }

  if(/compare|versus|vs\.?|which.*better|best/i.test(l)){
    const pair=available.filter(r=>r.kind==='Ambulance'||r.kind==='Hospital'||r.kind==='Shelter').slice(0,4);
    return `I can compare the configured resource records, but I would not call one “best” from distance alone.\n\n${pair.length?pair.map(r=>`• ${r.name}: ${r.status}; ${r.distance}; ${r.value}`).join('\n'):'No comparable resources are loaded.'}\n\nDecision rule: prioritize a resource that is suitable, reachable, and independently verified as available.`;
  }

  if(/why|explain/i.test(l)&&incident)
    return `For ${incident.location}, the reason I’m prioritizing this record is its ${incident.severity} severity and ${incident.cred}% credibility score. Its current status is “${incident.status}”.\n\nI would verify the observation, confirm access, and then coordinate ${incident.owner==='Unassigned'?'an appropriate team':incident.owner}. I would not infer facts that are not in the record.`;

  return `I understand the request. Based on the current ResQvision records, I can make a recommendation rather than just repeat the data.\n\nCurrent picture: ${active.length} active incidents, ${critical.length} critical, ${review.length} unverified social signals, and ${responding.length} teams responding.\n\nTell me the decision you want help with — for example:\n• “Which incident should I handle first?”\n• “Why is Velachery a priority?”\n• “Which team should I dispatch?”\n• “Check medical resources.”\n• “Give me a commander brief.”`;
}
function draftAlert(){if(role!=='admin')return toast('Admin permission required.');const t=document.getElementById('alertText').value.trim();if(!t)return toast('Add an alert message first.');const a={id:Date.now(),audience:document.getElementById('alertAudience').value,message:t,status:'DRAFT',createdAt:new Date().toLocaleString()};alerts.unshift(a);closeModal('alertModal');persist();renderAlert();toast('Official alert draft created.')}
function publishAlert(id){if(role!=='admin')return toast('Admin permission required.');const a=alerts.find(x=>x.id===id);if(!a)return;a.status='PUBLISHED';a.publishedAt=new Date().toLocaleString();addActivity(`Official alert published to ${a.audience}`,'green');persist();renderAlert();toast('Demo alert published and recorded.')}
function deleteAlert(id){if(role!=='admin')return toast('Admin permission required.');alerts=alerts.filter(a=>a.id!==id);persist();renderAlert();toast('Alert removed.')}
function renderAlert(){const f=document.getElementById('alertFilter')?.value||'';const rows=alerts.filter(a=>!f||a.status===f);document.getElementById('alertList').innerHTML=rows.length?rows.map(a=>`<div class="resource" style="margin-bottom:8px"><span class="status ${a.status==='PUBLISHED'?'ok':'warn'}">${a.status}</span><strong>${escapeHtml(a.audience)}</strong><div class="meta">${escapeHtml(a.message)}</div><div class="meta">Created: ${escapeHtml(a.createdAt)}${a.publishedAt?' · Published: '+escapeHtml(a.publishedAt):''}</div><div class="action-row">${a.status==='DRAFT'?`<button class="btn small primary" onclick="publishAlert(${a.id})">Publish</button>`:''}<button class="btn small danger" onclick="deleteAlert(${a.id})">Delete</button></div></div>`).join(''):'<div class="empty">No alerts recorded yet. Create a draft to begin the alert workflow.</div>'}

function deleteCitizenReport(id){if(role!=='admin')return toast('Admin permission required.');const reports=getCitizenReports(),report=reports.find(x=>x.id===id);if(!report)return;if(!report.image)return;if(!confirm('Delete only the submitted photo? The citizen report details will be kept. This cannot be undone.'))return;report.image='';report.imageDeletedAt=new Date().toISOString();localStorage.setItem('resqvision_citizen_reports',JSON.stringify(reports));renderCitizenReports();try{if(reportChannel)reportChannel.postMessage({type:'PHOTO_DELETED',id:id})}catch(e){}if(typeof addActivity==='function')addActivity('Citizen report '+id+' photo deleted','red');toast('Citizen photo deleted. Report details kept.')}
function openCitizenReportMap(lat,lng,id){if(typeof L==='undefined'){alert('Map library is unavailable. Coordinates: '+lat+', '+lng);return}if(typeof showView==='function'&&document.getElementById('map'))showView('map');setTimeout(()=>{const m=typeof fullMap!=='undefined'&&fullMap?fullMap:(typeof map!=='undefined'?map:null);if(m){m.setView([lat,lng],16);L.popup().setLatLng([lat,lng]).setContent('<b>Citizen report '+id+'</b><br>'+Number(lat).toFixed(5)+', '+Number(lng).toFixed(5)).openOn(m)}else alert('Citizen report location: '+Number(lat).toFixed(5)+', '+Number(lng).toFixed(5))},150)}
function renderCitizenReports(){const el=document.getElementById('citizenReportsList');if(!el)return;const reports=getCitizenReports();if(!reports.length){el.innerHTML='<div class="empty">No citizen photo reports yet. Submit one from citizen.html, then refresh this dashboard.</div>';return}el.innerHTML=reports.map(function(r){const safeId=String(r.id).replace(/'/g,"\\'");return '<div class="report-card">'+(r.image?'<img src="'+r.image+'" alt="Citizen incident photo">':'<div style="width:170px;height:120px;border-radius:10px;background:#f1f4f7;display:grid;place-items:center;color:#667a8d;font-size:11px;text-align:center;padding:12px">Photo deleted<br>Report details retained</div>')+'<div class="report-meta"><strong>'+escapeHtml(r.type||'Citizen incident')+' · '+escapeHtml(r.id)+'</strong><div>'+escapeHtml(r.description||'No description')+'</div><div style="margin-top:5px">📍 '+Number(r.lat).toFixed(5)+', '+Number(r.lng).toFixed(5)+' · ±'+Math.round(r.accuracy||0)+'m</div><div>🕒 '+new Date(r.createdAt).toLocaleString()+'</div>'+(r.contact?'<div>Contact: '+escapeHtml(r.contact)+'</div>':'')+'<div style="margin-top:6px"><span class="tag blue">'+escapeHtml(r.status||'NEW')+'</span></div></div><div class="report-actions"><button class="btn small" onclick="openCitizenReportMap('+Number(r.lat)+','+Number(r.lng)+',\''+safeId+'\')">View on map</button><button class="btn small primary" onclick="updateCitizenReportStatus(\''+safeId+'\',\'VERIFIED\')">Verify</button><button class="btn small danger" onclick="updateCitizenReportStatus(\''+safeId+'\',\'DISPATCHED\')">Dispatch</button>'+(r.image?'<button class="btn small danger" onclick="deleteCitizenReport(\''+safeId+'\')">Delete photo</button>':'<button class="btn small" disabled>Photo deleted</button>')+'</div></div>'}).join('')}
let reportChannel=null;try{reportChannel=new BroadcastChannel('resqvision_reports');reportChannel.onmessage=function(e){if(e.data&&e.data.type==='NEW_REPORT'){renderCitizenReports();toast('New citizen incident received.')}}}catch(e){}
window.addEventListener('storage',function(e){if(e.key==='resqvision_citizen_reports')renderCitizenReports()});
setInterval(renderCitizenReports,1500);
</script>
</body></html>
